[project]
name = "flight-agent-backend"
version = "0.1.0"
description = "Backend project metadata for the Flight Agent V0 monorepo."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "playwright",
    "pydantic",
    "pydantic-settings",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests/backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/flight_agent"]

[tool.pyright]
include = ["src", "../../tests/backend"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flight_agent}
      POSTGRES_USER: ${POSTGRES_USER:-flight_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flight_agent_local_password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - flight-agent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flight-agent-postgres-data:
